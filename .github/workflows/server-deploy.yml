name: Deploy Server (server.tuffersbd.com)

on:
  push:
    branches: [ "main" ]
    paths:
      - "server/**"
      - ".github/workflows/server-deploy.yml"

jobs:
  deploy-server:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies (just to verify lockfile)
        run: |
          cd server
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Deploy to cPanel via SFTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.SFTP_HOST }}
          username: ${{ secrets.SERVER_FTP_USER }}
          password: ${{ secrets.SFTP_PASSWORD }}
          protocol: sftp
          port: 22
          local-dir: server/
          server-dir: server.tuffersbd.com/
          dangerous-clean-slate: true
          exclude: |
            **/.git*
            **/.DS_Store
            server/node_modules/**
            server/test/**
            server/tests/**
            server/coverage/**
            server/.env.local
            server/.vscode/**
            server/*.md

      - name: Restart Node.js App (SSH)
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SFTP_PASSWORD }}
          port: 21098
          script: |
            cd ~/server.tuffersbd.com
            npm install
            touch tmp/restart.txt || mkdir -p tmp && touch tmp/restart.txt
