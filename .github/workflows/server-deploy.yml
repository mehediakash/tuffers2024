name: Deploy Server (server.tuffersbd.com)

on:
  push:
    branches: [ "main" ]
    paths:
      - "server/**"

jobs:
  deploy-server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        working-directory: server
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: server-artifact
          path: server/**
          retention-days: 3

      - name: Deploy via SFTP (auto-create folder)
        uses: wlixcc/SFTP-Deploy-Action@v1.2
        with:
          host: ${{ secrets.SERVER_HOST }}
          port: 21098
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SFTP_PASSWORD }}
          local_path: server/*
          server-dir: ./server.tuffersbd.com/  # Added ./ prefix
          args: "-o StrictHostKeyChecking=no"

      - name: Restart Node.js App (SSH)
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SFTP_PASSWORD }}
          port: 21098
          script: |
            cd ~/server.tuffersbd.com
            npm install
            mkdir -p tmp && touch tmp/restart.txt
