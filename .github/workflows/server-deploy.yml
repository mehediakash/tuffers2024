name: 🚀 Deploy Backend Server (server.tuffersbd.com)

on:
  push:
    branches: [ "main" ]
    paths:
      - "server/**"
      - ".github/workflows/server-deploy.yml"

jobs:
  build-and-deploy-server:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout code
      - name: ⬇️ Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ Setup Node.js + caching
      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: server/package-lock.json

      # 3️⃣ Install dependencies
      - name: 📦 Install Dependencies
        working-directory: server
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      # 4️⃣ Optional: Debug - list server files
      - name: 🔍 List server folder
        run: ls -la server/

      # 5️⃣ Build server (if you have build step, else skip)
      - name: 🛠️ Build server
        working-directory: server
        run: |
          if [ -f package.json ] && grep -q '"build"' package.json; then
            npm run build
          else
            echo "⚠️ No build step found, skipping..."
          fi

      # 6️⃣ Upload dist folder via FTP
      - name: 📂 Upload backend `server/` via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SFTP_PASSWORD }}
          protocol: ftp
          port: 21
          local-dir: server/                      
          dangerous-clean-slate: true
          exclude: |
            **/.git*
            **/.DS_Store
            server/node_modules/**
            server/test/**
            server/tests/**
            server/coverage/**
            server/.env.local
            server/.vscode/**
            server/*.md

      # 7️⃣ Prepare restart trigger file
      - name: 🧼 Prepare tmp directory with fresh restart.txt
        working-directory: server
        run: |
          mkdir -p tmp
          date > tmp/restart.txt

      # 8️⃣ Upload restart.txt via FTP
      - name: 📂 Restart trigger via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SFTP_PASSWORD }}
          protocol: ftp
          port: 21
          local-dir: server/tmp/
