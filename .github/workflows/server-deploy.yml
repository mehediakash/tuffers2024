name: Deploy Server (server.tuffersbd.com)

on:
  push:
    branches: [ "main" ]
    paths:
      - "server/**"
      - ".github/workflows/server-deploy.yml"

concurrency:
  group: server-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy-server:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    env:
      REMOTE_SERVER_DIR: server.tuffersbd.com/

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node (server)
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install deps (server)
        run: |
          cd server
          if [ -f package-lock.json ]; then npm ci; else npm i; fi

      - name: Build (server)
        run: |
          cd server
          npm run build   # must output to server/dist

      - name: Upload artifact (server-dist)
        uses: actions/upload-artifact@v4
        with:
          name: server-dist
          path: |
            server/dist
            server/package.json
            server/package-lock.json
          retention-days: 7
          if-no-files-found: error

      # Deploy only what's needed (dist + package files). Exclude dev junk.
      - name: Deploy to cPanel (SFTP)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.SFTP_HOST }}
          username: ${{ secrets.SFTP_USER }}
          password: ${{ secrets.SFTP_PASSWORD }}
          protocol: sftp
          port: 22
          local-dir: server
          server-dir: ${{ env.REMOTE_SERVER_DIR }}
          dangerous-clean-slate: true
          exclude: |
            **/.git*
            **/.DS_Store
            server/node_modules/**
            server/src/**
            server/test/**
            server/tests/**
            server/coverage/**
            server/.env*
            server/.vscode/**
            server/*.md
            server/*.ts
            server/tsconfig*.json

      # Restart cPanel Node.js app
      - name: Restart Node.js App (SSH)
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.SFTP_HOST }}
          username: ${{ secrets.SFTP_USER }}
          password: ${{ secrets.SFTP_PASSWORD }}
          port: 22
          script: |
            cd ~/${{ env.REMOTE_SERVER_DIR }}
            if [ -f package-lock.json ]; then npm ci --omit=dev; else npm i --production; fi
            # cPanel Passenger restart trigger:
            mkdir -p tmp
            touch tmp/restart.txt
            echo "Restarted $(date)"
