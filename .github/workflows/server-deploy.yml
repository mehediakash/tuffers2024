name: Deploy Backend Server (server.tuffersbd.com)

on:
  push:
    branches: ["main"]
    paths:
      - "server/**"
      - ".github/workflows/server-deploy.yml"

jobs:
  build-and-deploy-server:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ Setup Node.js + caching
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: server/package-lock.json

      # 3️⃣ Install dependencies
      - name: Install Dependencies
        working-directory: server
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      # 4️⃣ Optional: List local files (debug)
      - name: List server folder
        run: |
          ls -la server/

      # 5️⃣ Upload server folder as artifact
      - name: Upload server artifact
        uses: actions/upload-artifact@v4
        with:
          name: server-artifact
          path: |
            server/**
            !server/node_modules/**
            !server/test/**
            !server/tests/**
            !server/coverage/**
            !server/.env.local
            !server/.vscode/**
          retention-days: 7

      # 6️⃣ Ensure remote folder exists (avoid 553)
      - name: Create remote folder via SSH
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SFTP_PASSWORD }}
          port: 21098
          script: |
            mkdir -p ~/server.tuffersbd.com

      # 7️⃣ Deploy server via FTP
      - name: Deploy server to cPanel via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SFTP_PASSWORD }}
          protocol: ftp
          port: 21
          local-dir: server/                        # local folder
          server-dir: server.tuffersbd.com/         # remote folder
          dangerous-clean-slate: true
          exclude: |
            **/.git*
            **/.DS_Store
            server/node_modules/**
            server/test/**
            server/tests/**
            server/coverage/**
            server/.env.local
            server/.vscode/**
            server/*.md

      # 8️⃣ Restart Node.js App via SSH
      - name: Restart Node.js App
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SFTP_PASSWORD }}
          port: 21098
          script: |
            cd ~/server.tuffersbd.com
            npm install --production
            mkdir -p tmp && touch tmp/restart.txt
