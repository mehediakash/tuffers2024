name: Deploy Server (server.tuffersbd.com)

on:
  push:
    branches: [ "main" ]
    paths:
      - "server/**"
      - ".github/workflows/server-deploy.yml"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 2️⃣ Setup Node.js + cache
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: server/package-lock.json

      # 3️⃣ Install dependencies
      - name: Install dependencies
        working-directory: server
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      # 4️⃣ Upload server folder as artifact (for reuse/debug)
      - name: Upload server artifact
        uses: actions/upload-artifact@v4
        with:
          name: server-artifact
          path: |
            server/**
            !server/node_modules/**
            !server/test/**
            !server/tests/**
            !server/coverage/**
            !server/.env.local
            !server/.vscode/**
          retention-days: 3

      # 5️⃣ Deploy server via FTPS
      - name: Deploy to cPanel via FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.SFTP_HOST }}
          username: ${{ secrets.SERVER_FTP_USER }}
          password: ${{ secrets.SFTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: server/
          dangerous-clean-slate: true
          exclude: |
            **/.git*
            **/.DS_Store
            server/node_modules/**
            server/test/**
            server/tests/**
            server/coverage/**
            server/.env.local
            server/.vscode/**
            server/*.md

      # 6️⃣ Restart Node.js App on cPanel via SSH
      - name: Restart Node.js App (SSH)
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SFTP_PASSWORD }}
          port: 21098
          script: |
            cd ~/server.tuffersbd.com
            npm install
            mkdir -p tmp && touch tmp/restart.txt
