name: Deploy Dashboard (admin.tuffersbd.com)

on:
  push:
    branches: [ "main" ]
    paths:
      - "dashboard/**"
      - ".github/workflows/dashboard-deploy.yml"


jobs:
  build-and-deploy-dashboard:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    env:
      REMOTE_ADMIN_DIR: admin.tuffersbd.com/

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node (dashboard)
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install deps (dashboard)
        run: |
          cd dashboard
          if [ -f package-lock.json ]; then npm ci; else npm i; fi

      - name: Build (dashboard)
        run: |
          cd dashboard
          npm run build  # must output to dashboard/dist

      - name: Upload artifact (dashboard-dist)
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-dist
          path: dashboard/dist
          retention-days: 7
          if-no-files-found: error

      - name: Deploy to cPanel (SFTP)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.SFTP_HOST }}
          username: ${{ secrets.DASHBOARD_USER }}
          password: ${{ secrets.SFTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: dashboard/dist/
          dangerous-clean-slate: true
          exclude: |
            **/.git*
            **/.DS_Store
            .well-known/**
            cgi-bin/**
            .htaccess
